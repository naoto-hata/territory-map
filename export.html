function kmlUrl(mid){return `https://www.google.com/maps/d/kml?mid=${encodeURIComponent(mid)}&forcekml=1`}
function coordsFromText(t){return t.trim().split(/\s+/).map(s=>s.split(',')).filter(a=>a.length>=2).map(a=>[parseFloat(a[0]),parseFloat(a[1])]).filter(a=>Number.isFinite(a[0])&&Number.isFinite(a[1]))}
function centerOf(coords){let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;for(const c of coords){minX=Math.min(minX,c[0]);minY=Math.min(minY,c[1]);maxX=Math.max(maxX,c[0]);maxY=Math.max(maxY,c[1]);}return[(minX+maxX)/2,(minY+maxY)/2]}
async function fetchWithTimeout(url,ms=15000){const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms);try{return await fetch(url,{cache:'no-store',signal:ctl.signal})}finally{clearTimeout(t)}}
async function one(x){
 if(manualFallback[x.n]){const pts=manualFallback[x.n].pts.map(p=>[p[1],p[0]]);const closed=[...pts];if(closed.length&&(closed[0][0]!==closed.at(-1)[0]||closed[0][1]!==closed.at(-1)[1]))closed.push([...closed[0]]);return[{type:'Feature',properties:{n:x.n,mid:x.mid||'',center:centerOf(pts),source:'PDF復元'},geometry:{type:'Polygon',coordinates:[closed]}}]}
 const r=await fetchWithTimeout(kmlUrl(x.mid));if(!r.ok)throw new Error('HTTP '+r.status);const txt=await r.text();if(!txt.includes('<kml'))throw new Error('KMLではありません');
 const xml=new DOMParser().parseFromString(txt,'text/xml'),feats=[],allCoords=[];
 for(const node of [...xml.getElementsByTagName('LineString')]){const c=node.getElementsByTagName('coordinates')[0];if(!c)continue;const pts=coordsFromText(c.textContent);if(pts.length<2)continue;allCoords.push(...pts);const closed=pts.length>3&&Math.abs(pts[0][0]-pts.at(-1)[0])<1e-7&&Math.abs(pts[0][1]-pts.at(-1)[1])<1e-7;feats.push({type:'Feature',properties:{n:x.n,mid:x.mid},geometry:closed?{type:'Polygon',coordinates:[pts]}:{type:'LineString',coordinates:pts}})}
 for(const node of [...xml.getElementsByTagName('Polygon')]){const c=node.getElementsByTagName('coordinates')[0];if(!c)continue;const pts=coordsFromText(c.textContent);if(pts.length<3)continue;allCoords.push(...pts);feats.push({type:'Feature',properties:{n:x.n,mid:x.mid},geometry:{type:'Polygon',coordinates:[pts]}})}
 if(!feats.length)throw new Error('線データなし');const ctr=centerOf(allCoords);feats.forEach(f=>f.properties.center=ctr);return feats;
}

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品分類一覧表</title>
<style>
*{box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:#f5f7fb;
  margin:0;
  padding:14px;
  color:#111;
}
header{
  position:sticky;
  top:0;
  background:rgba(245,247,251,.97);
  backdrop-filter:blur(8px);
  z-index:10;
  padding:10px 0 12px;
  border-bottom:1px solid #e2e8f0;
}
h1{font-size:24px;margin:0 0 6px}
.notice{font-size:12px;color:#666;line-height:1.45}
.search{
  width:100%;
  font-size:16px;
  padding:12px 14px;
  border:1px solid #cbd5e1;
  border-radius:14px;
  margin-top:10px;
  background:white;
}
.tabs{
  display:flex;
  gap:8px;
  margin:12px 0 6px;
  overflow-x:auto;
  padding-bottom:4px;
}
.tab{
  border:0;
  border-radius:999px;
  padding:9px 14px;
  font-weight:800;
  background:#e5e7eb;
  color:#111;
  white-space:nowrap;
}
.tab.active{background:#0f3f8f;color:white}
.subtabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:4px 0 2px;
}
.subtab{
  border:1px solid #dbeafe;
  background:#fff;
  color:#1e3a8a;
  border-radius:999px;
  padding:7px 11px;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}
.subtab.active{background:#dbeafe}
.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:12px 0;
}
.stat{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:10px;
  text-align:center;
  box-shadow:0 1px 6px rgba(15,23,42,.06);
}
.stat .num{font-size:20px;font-weight:900;color:#0f3f8f}
.stat .label{font-size:11px;color:#64748b;font-weight:700}
.list{display:grid;gap:12px;margin-top:10px}
.card{
  background:white;
  border-radius:20px;
  padding:15px;
  box-shadow:0 3px 12px rgba(15,23,42,.10);
  border:1px solid #e5e7eb;
}
.cardTop{
  display:flex;
  gap:8px;
  align-items:flex-start;
  justify-content:space-between;
}
.product{font-size:18px;font-weight:900;line-height:1.35;color:#0f172a}
.company{font-size:14px;color:#334155;font-weight:800;margin-top:4px}
.category{font-size:13px;color:#64748b;margin-top:6px;line-height:1.45}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  padding:5px 9px;
  font-size:12px;
  font-weight:800;
  border:1px solid #e5e7eb;
  background:#f8fafc;
  color:#334155;
}
.badge.rec{background:#ecfdf5;border-color:#bbf7d0;color:#166534}
.badge.corp{background:#eef2ff;border-color:#c7d2fe;color:#3730a3}
.badge.fx{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
.badge.var{background:#fdf2f8;border-color:#fbcfe8;color:#9d174d}
.badge.spec{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.metaRow{margin-top:10px;font-size:12px;color:#64748b;display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:#64748b;padding:30px 10px}
.historyButton{
  width:100%;
  margin-top:10px;
  padding:11px;
  border:1px solid #cbd5e1;
  background:white;
  border-radius:14px;
  font-weight:800;
}
.history{display:none;margin-top:10px;background:white;border:1px solid #e5e7eb;border-radius:18px;padding:12px}
.history.open{display:block}
.historyItem{border-bottom:1px solid #e5e7eb;padding:9px 0;font-size:13px;line-height:1.45}
.historyItem:last-child{border-bottom:0}
.historyDate{font-weight:900;color:#0f3f8f;margin-bottom:3px}
.footer{margin:24px 0 10px;color:#64748b;font-size:12px;text-align:center}
@media(max-width:480px){
  .summary{grid-template-columns:repeat(2,1fr)}
  .product{font-size:17px}
}
</style>
</head>
<body>
<header>
  <h1>商品分類一覧表</h1>
  <div class="notice">2026年3月版。商品名・会社名・分類で検索できます。</div>
  <input id="search" class="search" placeholder="商品名・会社名・分類で検索">
  <div class="tabs" id="tabs"></div>
  <div class="subtabs" id="subtabs"></div>
</header>

<div class="summary">
  <div class="stat"><div class="num" id="countAll">0</div><div class="label">表示件数</div></div>
  <div class="stat"><div class="num" id="countInd">0</div><div class="label">個人推奨</div></div>
  <div class="stat"><div class="num" id="countCorp">0</div><div class="label">法人推奨</div></div>
  <div class="stat"><div class="num" id="countSpecial">0</div><div class="label">外貨/変額</div></div>
</div>

<button class="historyButton" onclick="toggleHistory()">変更履歴を表示 / 非表示</button>
<div class="history" id="history"></div>

<main class="list" id="list"></main>
<div class="footer">元資料：商品分類一覧表【202603】</div>

const MAIN_TABS = [
  {key:"all", label:"全部"},
  {key:"individual", label:"個人推奨"},
  {key:"corporate", label:"法人推奨"},
  {key:"medical", label:"医療"},
  {key:"cancer", label:"がん"},
  {key:"life", label:"死亡保障"},
  {key:"income", label:"収入保障"},
  {key:"variable", label:"変額"},
  {key:"foreign", label:"外貨"},
  {key:"nonlife", label:"損保"}
];

let currentTab = "all";
let currentCategory = "all";

function norm(s) {
  return String(s ?? "").toLowerCase().replace(/\s+/g, "");
}

function matchesMain(row) {
  const cat = row["大分類"] || "";
  const name = row["商品名"] || "";
  const kind = row["種類"] || "";
  if (currentTab === "all") return true;
  if (currentTab === "individual") return row["個人推奨"];
  if (currentTab === "corporate") return row["法人推奨"];
  if (currentTab === "medical") return cat.includes("医療") || cat.includes("緩和型医療");
  if (currentTab === "cancer") return cat.includes("がん");
  if (currentTab === "life") return cat.includes("終身") || cat.includes("定期") || cat.includes("養老") || cat.includes("死亡");
  if (currentTab === "income") return cat.includes("収入保障") || cat.includes("就業不能");
  if (currentTab === "variable") return row["変額保険"] || cat.includes("変額");
  if (currentTab === "foreign") return row["外貨保険"] || cat.includes("外貨");
  if (currentTab === "nonlife") return kind.includes("損保") || cat.includes("火災") || cat.includes("自動車") || cat.includes("傷害");
  return true;
}

function getMainFiltered() {
  return DATA.filter(matchesMain);
}

function updateSubTabs() {
  const cats = [...new Set(getMainFiltered().map(r => r["大分類"]).filter(Boolean))];
  const el = document.getElementById("subtabs");
  let html = `<button class="subtab ${currentCategory==="all" ? "active":""}" onclick="setCategory('all')">分類すべて</button>`;
  cats.slice(0, 30).forEach(cat => {
    html += `<button class="subtab ${currentCategory===cat ? "active":""}" onclick="setCategory(${JSON.stringify(cat)})">${escapeHtml(shortCat(cat))}</button>`;
  });
  el.innerHTML = html;
}

function shortCat(s) {
  return String(s).replace(/保険/g,"").replace(/（/g," ").replace(/）/g,"").trim();
}

function setTab(key) {
  currentTab = key;
  currentCategory = "all";
  document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
  document.querySelector(`[data-tab="${key}"]`).classList.add("active");
  updateSubTabs();
  render();
}

function setCategory(cat) {
  currentCategory = cat;
  updateSubTabs();
  render();
}

function filteredRows() {
  const q = norm(document.getElementById("search").value);
  return DATA.filter(row => {
    if (!matchesMain(row)) return false;
    if (currentCategory !== "all" && row["大分類"] !== currentCategory) return false;
    if (!q) return true;
    const hay = norm(Object.values(row).join(" "));
    return hay.includes(q);
  });
}

function badge(text, cls="") {
  return `<span class="badge ${cls}">${escapeHtml(text)}</span>`;
}

function render() {
  const rows = filteredRows();
  document.getElementById("countAll").textContent = rows.length;
  document.getElementById("countInd").textContent = rows.filter(r => r["個人推奨"]).length;
  document.getElementById("countCorp").textContent = rows.filter(r => r["法人推奨"]).length;
  document.getElementById("countSpecial").textContent = rows.filter(r => r["外貨保険"] || r["変額保険"]).length;

  const list = document.getElementById("list");
  if (!rows.length) {
    list.innerHTML = `<div class="empty">該当する商品がありません</div>`;
    return;
  }

  list.innerHTML = rows.map(row => {
    let badges = "";
    if (row["個人推奨"]) badges += badge("個人推奨", "rec");
    if (row["法人推奨"]) badges += badge("法人推奨", "corp");
    if (row["外貨保険"]) badges += badge("外貨", "fx");
    if (row["変額保険"]) badges += badge("変額", "var");
    if (row["特定保険商品"]) badges += badge("特定保険商品", "spec");
    if (row["特別加算金除外商品"]) badges += badge("特別加算金除外", "spec");
    if (!badges) badges = badge("通常商品");

    return `<article class="card">
      <div class="cardTop">
        <div>
          <div class="product">${escapeHtml(row["商品名"])}</div>
          <div class="company">${escapeHtml(row["保険会社"])}</div>
        </div>
      </div>
      <div class="category">${escapeHtml(row["大分類"])}</div>
      <div class="badges">${badges}</div>
      <div class="metaRow">
        <span>分類番号：${escapeHtml(row["分類番号"])}</span>
        <span>種類：${escapeHtml(row["種類"])}</span>
        <span>分野：${escapeHtml(row["分野"])}</span>
      </div>
    </article>`;
  }).join("");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function toggleHistory() {
  document.getElementById("history").classList.toggle("open");
}

function renderHistory() {
  const el = document.getElementById("history");
  el.innerHTML = HISTORY.slice().reverse().map(h => 
    `<div class="historyItem"><div class="historyDate">${escapeHtml(h["日付"])}</div><div>${escapeHtml(h["変更内容"]).replace(/\n/g,"<br>")}</div></div>`
  ).join("");
}

function init() {
  document.getElementById("tabs").innerHTML = MAIN_TABS.map(t => 
    `<button class="tab ${t.key==="all" ? "active":""}" data-tab="${t.key}" onclick="setTab('${t.key}')">${t.label}</button>`
  ).join("");
  updateSubTabs();
  renderHistory();
  render();
  document.getElementById("search").addEventListener("input", render);
}
init();
</script>

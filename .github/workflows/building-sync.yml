name: Weekly building list sync
on:
  schedule:
    - cron: '17 23 * * 0' # Monday approximately 08:17 JST; GitHub may delay execution.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: building-list-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main' && vars.BUILDING_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check update safety
        run: node --test scripts/building-sync.test.cjs
      - name: Install isolated reader
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Read building names only
        env:
          BERRY_USERNAME: ${{ secrets.BERRY_USERNAME }}
          BERRY_PASSWORD: ${{ secrets.BERRY_PASSWORD }}
          BERRY_LOGIN_POST_PATH: ${{ vars.BERRY_LOGIN_POST_PATH }}
        run: node scripts/sync-buildings.cjs
      - name: Commit the checked list
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- index.html
            git commit -m 'Update building list from read-only weekly check'
            git push origin HEAD:main
          fi
      - name: Request Pages refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
